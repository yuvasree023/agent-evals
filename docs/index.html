</div><a href="#trace/v2-V01" class="traceRow"><div><strong>V01 / T015</strong><div class="meta">Agent v2 • trial 1</div></div><div>Refund 4000 cents for O1015.</div><div><span class="status">Write blocked by confirmation gate</span><div class="meta">Human label: not supplied</div></div><span class="link">View trace →</span></a></section>${foot()}`;document.getElementById('experiment').onchange=x=>{experiment=x.target.value;overview()}}
function traceList(){app.innerHTML=`<h1>Trace explorer</h1><p class="sub">80 selected Groq v1/v2 synthetic dev traces. This is a review sample, not all 280 main runs.</p><div class="notice">Original v1 human labels are shown unchanged, with reasons. V01-V30 human labels are not supplied. No automatic verdict replaces a human label.</div><div class="filters"><label>Search task, case, request or answer<input id="search" type="search" placeholder="Try T015 or refund" value="${esc(search)}"></label><label>Agent version<select id="version"><option value="all">All versions</option><option value="v1">Agent v1</option><option value="v2">Agent v2</option></select></label></div><button class="action" id="reset">Reset filters</button><div id="results"></div>${foot()}`;document.getElementById('version').value=version;document.getElementById('search').oninput=e=>{search=e.target.value;tracePage=0;listResults()};document.getElementById('version').onchange=e=>{version=e.target.value;tracePage=0;listResults()};document.getElementById('reset').onclick=()=>{search='';version='all';tracePage=0;traceList()};listResults()}
function listResults(){const a=D.traces.filter(x=>(version==='all'||x.agent_version===version)&&[x.task_id,x.case,x.input,x.answer].join(' ').toLowerCase().includes(search.toLowerCase()));document.getElementById('results').innerHTML=`<p class="count" role="status">${a.length} of ${D.traces.length} traces</p>`+(a.length?a.slice(tracePage*12,tracePage*12+12).map(x=>`<a class="traceItem" href="#trace/${encodeURIComponent(x.id)}"><strong>${esc(x.case)} / ${esc(x.task_id)} • Agent ${x.agent_version}</strong><div class="meta">${esc(x.source)} • trial ${x.trial} • Human: ${esc(x.human_label?.label||'not supplied')}</div><p>${esc(x.input)}</p></a>`).join(''):'<div class="empty">No traces match. Try a task ID or reset the filters.</div>')+pager(a.length,tracePage,12,'trace');bindPager('trace',a.length,12)}
function pager(total,page,size,type){return total>size?`<div class="actions"><button class="action" id="${type}-prev" ${page===0?'disabled':''}>Previous</button><span class="count">Page ${page+1} of ${Math.ceil(total/size)}</span><button class="action" id="${type}-next" ${(page+1)*size>=total?'disabled':''}>Next</button></div>`:''}
function bindPager(type,total,size){for(const [dir,delta] of [['prev',-1],['next',1]]){const b=document.getElementById(type+'-'+dir);if(b)b.onclick=()=>{if(type==='trace'){tracePage+=delta;listResults()}else{failurePage+=delta;failures()}document.getElementById(type==='trace'?'results':'app').scrollIntoView({block:'start'})}}}
function traceDetail(id){const x=D.traces.find(t=>t.id===id);if(!x){app.innerHTML='<h1>Trace not found</h1><a class="action" href="#traces">Back to traces</a>';return}const writes=x.trace.filter(t=>['refund_order','change_address','cancel_order'].includes(t.tool)),effects=writes.filter(t=>t.output?.ok===true),blocked=writes.filter(t=>t.output?.error||t.gate==='blocked');app.innerHTML=`<a class="crumb" href="#traces">← Trace explorer / Groq M1 / Agent ${x.agent_version}</a><div class="heading" style="margin-top:18px"><div><h1>${esc(x.case)}: ${blocked.length?'a blocked write':effects.length?'a recorded write':'inside the trace'}</h1><p class="sub">Task ${esc(x.task_id)} • trial ${x.trial} • ${esc(x.source)} • saved synthetic dev trace</p></div><span class="pill">Human: ${esc(x.human_label?.label||'pending')}</span></div><div class="prompt"><div class="sub">Customer request</div><p>${esc(x.input)}</p></div><div class="grid"><section class="panel"><h2>Tool-call timeline</h2><p class="sub">An attempted write is not a successful write.</p><div class="timeline">${x.trace.map((t,i)=>`<div class="step ${t.output?.error?'block':''}"><h3>${String(i+1).padStart(2,'0')} ${esc(t.tool)}</h3><pre class="code">${json(t.args)}</pre><details><summary>Tool result ${t.output?.error?'• rejected':t.output?.ok?'• successful effect':''}</summary><pre>${json(t.output)}</pre></details></div>`).join('')||'<p>No tool calls recorded.</p>'}</div><h3>Final answer</h3><div class="answer">${esc(x.answer)}</div></section><section class="panel"><h2>What the evidence says</h2><div class="check"><h3>Observed tool effects</h3><p>${effects.length} successful write effect(s); ${blocked.length} rejected write attempt(s) recorded. Read every tool result separately.</p></div><div class="check"><h3>Human verdict</h3><p>${x.human_label?esc(x.human_label.label+': '+x.human_label.reason):'Not supplied. A blocked write does not automatically assign a PASS label.'}</p></div><div class="check"><h3>Review scope</h3><p>Tool effects, final-answer truth and policy compliance are separate questions. Original labels and pending policy decisions are not amended here.</p></div><div class="notice">Synthetic test scenario. No real customer order or payment is involved.</div><p class="source" style="margin-top:18px">Source: ${esc(x.source_file)}<br>Case ${esc(x.case)} / ${esc(x.source)} / ${esc(x.task_id)} / trial ${x.trial}</p><div class="actions"><button id="download" class="action">Download this trace JSON</button><a class="action" href="#traces">Back to traces</a></div></section></div>${foot()}`;document.getElementById('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=x.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
function failures(){const counts={};D.ledger.forEach(x=>counts[x.primary_category]=(counts[x.primary_category]||0)+1);const a=D.ledger.filter(x=>category==='all'||x.primary_category===category);app.innerHTML=`<h1>Failure atlas</h1><p class="sub">118 historical v1 smoke failures: 78 main + 40 separate flip runs.</p><div class="notice">This retrospective audit separates agent errors (A) from measurement errors (E). Audit categories are not new human labels. Each smoke-failed run has one primary category.</div><div class="atlas"><button class="category ${category==='all'?'active':''}" data-category="all">All categories<strong>118 audited runs</strong></button>${Object.entries(D.categories).map(([k,n])=>`<button class="category ${category===k?'active':''}" data-category="${k}">${k}<strong>${esc(n)}</strong><span class="meta">${counts[k]} run(s)</span></button>`).join('')}</div><p class="count" role="status">${a.length} audited runs in this view</p>${a.slice(failurePage*8,failurePage*8+8).map(x=>`<article class="ledger"><h3>${esc(x.primary_category)} / ${esc(x.run_id)}</h3><p>${esc(x.open_code_note)}</p><details><summary>Open request, answer and tool evidence</summary><p class="meta">Request</p><p>${esc(x.input)}</p><p class="meta">Final answer</p><div class="answer">${esc(x.answer)}</div><pre>${json(x.trace)}</pre><p class="source">Record SHA-256: ${esc(x.record_sha256)}<br>Historical smoke result: FAIL. Human verdict: not assigned by this audit.</p></details></article>`).join('')}${pager(a.length,failurePage,8,'failure')}${foot()}`;app.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;failurePage=0;failures()});bindPager('failure',a.length,8)}
function evidence(){app.innerHTML=`<h1>Evidence and limits</h1><p class="sub">What is built, what has been measured, and what still needs validation.</p><div class="notice">This portfolio demo visualizes saved synthetic development results. It does not execute an agent, connect to orders or evaluate a live model.</div><div class="grid" style="margin-top:24px"><section class="panel"><h2>Recorded work</h2>${evidenceRows()}<div class="check"><h3>Original labels</h3><p>50 owner labels: 40 PASS / 10 FAIL. Preserved unchanged. Historical judge evaluation was not a clean independent test: the rubric was written after seeing v1 labels.</p></div><div class="check"><h3>Bias experiment</h3><p>12 traces × 4 variants = 48 calls. All were judged PASS; each comparison had 0 / 12 flips. This small all-PASS slice does not establish absence of bias or judge accuracy.</p></div></section><section class="panel"><h2>Open validation gates</h2><div class="check"><h3>Human evidence</h3><p>V01-V30 labels; T020 and C01/C03/C04 policy decisions; reviewed tool-reference and atomic-claim annotations; more real human-labelled trials.</p></div><div class="check"><h3>Repeated comparisons</h3><p>Fresh Groq v2 uncached flip check completed: 70 / 70 runs. Candidate four-trial comparisons and release gates remain open.</p></div><div class="check"><h3>Release</h3><p>No candidate promotion or release validation claimed. The 15-task holdout remains untouched by model runs; release authority and protocol are unresolved.</p></div><div class="notice">Offline tests, scripted scores, model verdicts and human validation are different kinds of evidence.</div></section></div><section class="lower"><h2>Source files</h2><p class="sub">Snapshot source commit ${D.source_commit}. These paths identify the public repository records used for this view.</p>${D.sources.map(s=>`<p class="source" style="padding:7px 0">${esc(s)}</p>`).join('')}<div class="actions"><a class="action" href="https://github.com/yuvasree023/agent-evals" target="_blank" rel="noopener noreferrer">Open project repository ↗</a></div></section>${foot()}`}
function route(){const hash=decodeURIComponent(location.hash.slice(1)||'overview'),page=hash.split('/')[0];document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===(page==='trace'?'traces':page)));if(page==='overview')overview();else if(page==='traces')traceList();else if(page==='trace')traceDetail(hash.slice(6));else if(page==='failures')failures();else if(page==='evidence')evidence();else{app.innerHTML='<h1>Page not found</h1><a class="action" href="#overview">Back to overview</a>'}document.title='Agent Evals | '+(page==='trace'?'Trace detail':page[0].toUpperCase()+page.slice(1));window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script><noscript>This demo needs JavaScript to explore saved results. No API calls are made. Source: github.com/yuvasree023/agent-evals</noscript></body></html>
